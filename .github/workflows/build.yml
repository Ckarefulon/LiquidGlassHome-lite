name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        # 不加 `|| true`：许可没接受就要当场失败，否则后面会给出看不懂的错误
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK 37
        # 与 app/build.gradle.kts 的 compileSdk 37 保持一致（MIUIX 的 AAR metadata 要求）
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Unit tests (host JVM)
        # 本仓库只建 Android 目标，没有 jvm 目标 ⇒ 没有 jvmTest 任务；
        # 单元测试统一落在各模块的 commonTest，由 host-JVM 变体执行。
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode release keystore
        # 没有配 secret 时（比如来自 fork 的 PR）跳过，让构建继续以「未签名」跑完
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDGLASS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::LIQUIDGLASS_KEYSTORE_BASE64 未配置，本次产出的 APK 不会签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liquidglasshome-release.jks"
          echo "LIQUIDGLASS_KEYSTORE_FILE=$RUNNER_TEMP/liquidglasshome-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          LIQUIDGLASS_KEYSTORE_PASSWORD: ${{ secrets.LIQUIDGLASS_KEYSTORE_PASSWORD }}
          LIQUIDGLASS_KEY_ALIAS: ${{ secrets.LIQUIDGLASS_KEY_ALIAS }}
          LIQUIDGLASS_KEY_PASSWORD: ${{ secrets.LIQUIDGLASS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $apk"
          ls -lh "$apk"
          if "$ANDROID_HOME"/build-tools/37.0.0/apksigner verify --print-certs "$apk"; then
            echo "✓ APK 已签名，可直接安装"
          else
            echo "::error::APK 未签名（缺签名 secret），装不上"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: LiquidGlassHome-release
          path: app/build/outputs/apk/release/*.apk
