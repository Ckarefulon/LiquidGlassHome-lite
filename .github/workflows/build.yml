name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests (JVM)
        run: ./gradlew :shared:model:jvmTest :shared:navigation:jvmTest :feature:home:jvmTest :core:jvmTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassHome-debug
          path: app/build/outputs/apk/debug/app-debug.apk