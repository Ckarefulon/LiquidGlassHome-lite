name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 37
        # 与 app/build.gradle.kts 的 compileSdk 37 保持一致；36 供 targetSdk 使用
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-36" "build-tools;36.0.0" --channel=3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests (JVM)
        run: ./gradlew :shared:model:jvmTest :shared:navigation:jvmTest :feature:home:jvmTest :core:jvmTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassHome-debug
          path: app/build/outputs/apk/debug/app-debug.apk